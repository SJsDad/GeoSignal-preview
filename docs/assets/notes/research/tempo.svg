<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>TEMPO: one height-conditioned generator, two input schemes</title><desc>Height means position inside the resist film; it is not scanner defocus.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#57606a"/></marker></defs><rect width="1100" height="520" rx="12" fill="#fff"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#24292f">TEMPO: one height-conditioned generator, two input schemes</text><text x="32" y="74" font-family="Arial,sans-serif" font-size="17" fill="#57606a">Height means position inside the resist film; it is not scanner defocus.</text><rect x="35" y="135" width="190" height="80" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="130.0" y="168.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Scheme 1</text><text x="130.0" y="193.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">mask image</text><rect x="35" y="310" width="190" height="100" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="130.0" y="353.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Scheme 2</text><text x="130.0" y="378.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">mask + thin image</text><rect x="330" y="215" width="200" height="100" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="430.0" y="258.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Shared encoder</text><text x="430.0" y="283.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">latent features</text><rect x="590" y="215" width="205" height="100" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="692.5" y="258.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Height label</text><text x="692.5" y="283.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">decoder condition</text><rect x="865" y="215" width="195" height="100" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="962.5" y="258.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Thick-mask</text><text x="962.5" y="283.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">aerial slice I(h)</text><path d="M225,175 L330,245" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M225,360 L330,285" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M530,265 L590,265" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M795,265 L865,265" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><text x="585" y="140" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#24292f">h = 0, 10, ... , 120 nm</text><path d="M690,155 L690,205" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><text x="330" y="425" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#24292f">One generator shares information across 13 height domains.</text><text x="32" y="490" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#24292f">Original explanatory diagram. Not a reproduced paper figure; not an experimental result.</text></svg>