<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>OptiCo: where optical phase enters the features</title><desc>Conceptual branch view based on the verified operation; channel widths are illustrative.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#57606a"/></marker></defs><rect width="1100" height="520" rx="12" fill="#fff"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#24292f">OptiCo: where optical phase enters the features</text><text x="32" y="74" font-family="Arial,sans-serif" font-size="17" fill="#57606a">Conceptual branch view based on the verified operation; channel widths are illustrative.</text><rect x="35" y="200" width="150" height="75" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="110.0" y="231.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Latent U</text><text x="110.0" y="256.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">real + imaginary</text><rect x="280" y="120" width="230" height="80" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="395.0" y="153.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Real backbone</text><text x="395.0" y="178.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">spatial features</text><rect x="280" y="300" width="230" height="80" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="395.0" y="333.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Complex convolution</text><text x="395.0" y="358.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Q multiplied by W</text><rect x="580" y="120" width="200" height="80" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="680.0" y="153.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Channel projection</text><text x="680.0" y="178.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">complex features</text><rect x="580" y="300" width="200" height="80" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="680.0" y="333.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Phase modulation</text><text x="680.0" y="358.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">elementwise product</text><rect x="870" y="210" width="185" height="100" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="962.5" y="253.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Residual fusion</text><text x="962.5" y="278.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">next feature</text><path d="M185,225 L280,160" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M185,250 L280,340" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M510,160 L580,160" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M680,200 L680,300" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M510,340 L580,340" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M780,340 L870,280" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M780,160 L870,240" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><text x="280" y="425" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#24292f">Q carries the phase prior. Learned W can relax the physical kernel.</text><text x="32" y="490" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#24292f">Original explanatory diagram. Not a reproduced paper figure; not an experimental result.</text></svg>