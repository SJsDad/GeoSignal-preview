<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>Nitho: learn kernels once, synthesize images repeatedly</title><desc>Masks use fixed FFT operations. The neural field sees kernel coordinates, not mask pixels.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#57606a"/></marker></defs><rect width="1100" height="520" rx="12" fill="#fff"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#24292f">Nitho: learn kernels once, synthesize images repeatedly</text><text x="32" y="74" font-family="Arial,sans-serif" font-size="17" fill="#57606a">Masks use fixed FFT operations. The neural field sees kernel coordinates, not mask pixels.</text><rect x="35" y="120" width="195" height="85" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="132.5" y="156.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Frequency</text><text x="132.5" y="181.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">coordinates</text><rect x="310" y="120" width="235" height="85" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="427.5" y="156.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Complex neural field</text><text x="427.5" y="181.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">learn optical kernels</text><rect x="625" y="120" width="175" height="85" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="712.5" y="168.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Cached K_j</text><rect x="35" y="325" width="195" height="85" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="132.5" y="373.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">New mask M</text><rect x="310" y="325" width="235" height="85" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="427.5" y="361.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Mask FFT</text><text x="427.5" y="386.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">fixed linear operation</text><rect x="865" y="240" width="210" height="110" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="970.0" y="276.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">K_j times FFT(M)</text><text x="970.0" y="301.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">IFFT, abs squared</text><text x="970.0" y="326.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">sum over modes</text><path d="M230,160 L310,160" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M545,160 L625,160" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M800,160 L865,265" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M230,365 L310,365" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M545,365 L865,320" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><text x="270" y="260" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#24292f">After training: reuse cached kernels, no per-mask MLP call</text><text x="32" y="490" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#24292f">Original explanatory diagram. Not a reproduced paper figure; not an experimental result.</text></svg>