<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>DOINN: global frequency context and local edge detail</title><desc>Conceptual dual-path view; this does not assert that learned features are physical fields.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#57606a"/></marker></defs><rect width="1100" height="520" rx="12" fill="#fff"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#24292f">DOINN: global frequency context and local edge detail</text><text x="32" y="74" font-family="Arial,sans-serif" font-size="17" fill="#57606a">Conceptual dual-path view; this does not assert that learned features are physical fields.</text><rect x="35" y="220" width="140" height="85" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="105.0" y="268.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Mask M</text><rect x="265" y="120" width="270" height="95" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="400.0" y="161.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Pool + one FFT</text><text x="400.0" y="186.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">global low-frequency branch</text><rect x="265" y="315" width="270" height="95" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="400.0" y="356.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">VGG convolution</text><text x="400.0" y="381.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">local detail branch</text><rect x="620" y="220" width="170" height="85" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="705.0" y="256.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Feature</text><text x="705.0" y="281.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">concatenation</text><rect x="855" y="220" width="215" height="85" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="962.5" y="256.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Reconstruction</text><text x="962.5" y="281.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">resist prediction</text><path d="M175,245 L265,170" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M175,285 L265,355" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M535,170 L620,245" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M535,355 L620,285" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M790,260 L855,260" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><text x="265" y="450" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#24292f">Large-tile inference needs overlap and valid core handling.</text><text x="32" y="490" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#24292f">Original explanatory diagram. Not a reproduced paper figure; not an experimental result.</text></svg>