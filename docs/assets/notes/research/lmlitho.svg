<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>LMLitho: mask-conditioned queries meet source tokens</title><desc>Attention is a learned interaction model. It is not an exact optical diffraction equation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#57606a"/></marker></defs><rect width="1100" height="520" rx="12" fill="#fff"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#24292f">LMLitho: mask-conditioned queries meet source tokens</text><text x="32" y="74" font-family="Arial,sans-serif" font-size="17" fill="#57606a">Attention is a learned interaction model. It is not an exact optical diffraction equation.</text><rect x="35" y="130" width="150" height="75" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="110.0" y="173.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Mask patches</text><rect x="260" y="130" width="215" height="75" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="367.5" y="161.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Mask encoder</text><text x="367.5" y="186.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">N mask tokens</text><rect x="35" y="310" width="150" height="75" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="110.0" y="353.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Source map</text><rect x="260" y="310" width="215" height="75" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="367.5" y="341.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Source encoder</text><text x="367.5" y="366.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Ns source tokens</text><rect x="590" y="215" width="205" height="90" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="692.5" y="253.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Cross-attention</text><text x="692.5" y="278.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">N x Ns weights</text><rect x="875" y="215" width="190" height="90" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="970.0" y="253.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Resist decoder</text><text x="970.0" y="278.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">pixel prediction</text><path d="M185,165 L260,165" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M185,345 L260,345" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M475,165 L590,235" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M475,345 L590,285" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M795,260 L875,260" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><text x="510" y="165" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#24292f">Q</text><text x="510" y="350" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#24292f">K, V</text><text x="260" y="440" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#24292f">Finetuning: source encoder frozen; other modules adapt</text><text x="32" y="490" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#24292f">Original explanatory diagram. Not a reproduced paper figure; not an experimental result.</text></svg>