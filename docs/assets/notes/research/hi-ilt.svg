<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>Hi-ILT: initialization and physics-guided refinement</title><desc>Only the two-stage mechanism is illustrated; unavailable hierarchical VAE internals are omitted.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#57606a"/></marker></defs><rect width="1100" height="520" rx="12" fill="#fff"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#24292f">Hi-ILT: initialization and physics-guided refinement</text><text x="32" y="74" font-family="Arial,sans-serif" font-size="17" fill="#57606a">Only the two-stage mechanism is illustrated; unavailable hierarchical VAE internals are omitted.</text><rect x="35" y="170" width="175" height="90" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="122.5" y="221.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Target layout</text><rect x="265" y="170" width="220" height="90" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="375.0" y="208.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Low-resolution</text><text x="375.0" y="233.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">learned initializer</text><rect x="540" y="170" width="205" height="90" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="642.5" y="208.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">High-resolution</text><text x="642.5" y="233.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">mask variables</text><rect x="800" y="170" width="260" height="90" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="930.0" y="208.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Imaging feedback</text><text x="930.0" y="233.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">ILT gradient update</text><path d="M210,215 L265,215" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M485,215 L540,215" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M745,215 L800,215" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M930,260 L930,350" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M930,350 L640,350" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M640,350 L640,260" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><text x="350" y="140" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#24292f">Binary forward / surrogate backward</text><text x="580" y="410" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#24292f">Refine edges and SRAF under process conditions</text><text x="32" y="490" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#24292f">Original explanatory diagram. Not a reproduced paper figure; not an experimental result.</text></svg>