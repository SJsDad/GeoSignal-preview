<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>ResGNN-OPC: residual learning as iterative edge updates</title><desc>Generic explanatory graph. Actual graph features, weights and training loss remain unverified.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#57606a"/></marker></defs><rect width="1100" height="520" rx="12" fill="#fff"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#24292f">ResGNN-OPC: residual learning as iterative edge updates</text><text x="32" y="74" font-family="Arial,sans-serif" font-size="17" fill="#57606a">Generic explanatory graph. Actual graph features, weights and training loss remain unverified.</text><circle cx="85" cy="185" r="22" fill="#ddf4ff" stroke="#0969da"/><circle cx="175" cy="135" r="22" fill="#ddf4ff" stroke="#0969da"/><circle cx="180" cy="270" r="22" fill="#ddf4ff" stroke="#0969da"/><circle cx="300" cy="200" r="22" fill="#ddf4ff" stroke="#0969da"/><path d="M85,185 L175,135" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M85,185 L180,270" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M175,135 L300,200" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M180,270 L300,200" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><text x="45" y="325" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#24292f">Edges/control points as nodes</text><rect x="410" y="155" width="235" height="105" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="527.5" y="201.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Neighbor aggregation</text><text x="527.5" y="226.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">learned increment</text><rect x="735" y="155" width="295" height="105" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="882.5" y="201.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">h next = h + increment</text><text x="882.5" y="226.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">predicted edge movement</text><path d="M325,200 L410,200" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M645,200 L735,200" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M850,260 L850,365" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M850,365 L520,365" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M520,365 L520,270" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><text x="650" y="425" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#24292f">Layer depth resembles update steps, not an exact solver trace.</text><text x="32" y="490" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#24292f">Original explanatory diagram. Not a reproduced paper figure; not an experimental result.</text></svg>