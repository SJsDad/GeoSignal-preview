<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>TokMan: geometry parameters, differentiable feedback</title><desc>Manhattan alignment is a representation constraint; complete manufacturing rules need separate checks.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#57606a"/></marker></defs><rect width="1100" height="520" rx="12" fill="#fff"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#24292f">TokMan: geometry parameters, differentiable feedback</text><text x="32" y="74" font-family="Arial,sans-serif" font-size="17" fill="#57606a">Manhattan alignment is a representation constraint; complete manufacturing rules need separate checks.</text><rect x="30" y="135" width="185" height="95" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="122.5" y="176.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Target polygons</text><text x="122.5" y="201.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">axis-aligned edges</text><rect x="260" y="135" width="210" height="95" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="365.0" y="176.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Segment points</text><text x="365.0" y="201.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">polygon + point IDs</text><rect x="520" y="135" width="240" height="95" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="640.0" y="176.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Diffusion Transformer</text><text x="640.0" y="201.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">predict axis offsets</text><rect x="820" y="135" width="245" height="95" rx="9" fill="#ddf4ff" stroke="#8c959f"/><text x="942.5" y="176.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Rendered mask</text><text x="942.5" y="201.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">binary geometry</text><path d="M215,182 L260,182" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M470,182 L520,182" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M760,182 L820,182" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="610" y="330" width="230" height="75" rx="9" fill="#f6f8fa" stroke="#8c959f"/><text x="725.0" y="361.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">Lithography</text><text x="725.0" y="386.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#24292f">target mismatch</text><path d="M940,230 L840,360" fill="none" stroke="#57606a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M610,365 L460,365" fill="none" stroke="#57606a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M460,365 L460,245" fill="none" stroke="#57606a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="40" y="365" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#24292f">Backward through rasterizer</text><text x="40" y="410" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#24292f">Point coordinates and offsets remain distinct from image pixels.</text><text x="32" y="490" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#24292f">Original explanatory diagram. Not a reproduced paper figure; not an experimental result.</text></svg>