<div class="review-filters" hidden>
  <label>발표 연도 <select id="review-year"><option value="">전체</option>{% assign years = site.data.papers | map: 'year' | uniq | sort | reverse %}{% for year in years %}<option>{{ year }}</option>{% endfor %}</select></label>
  <label>연구 분야 <select id="review-field"><option value="">전체</option><option>Forward Simulation</option><option>ILT</option><option>OPC</option><option>Mask Topography</option></select></label>
  <label>Architecture <select id="review-architecture"><option value="">전체</option>{% for paper in site.data.papers %}<option>{{ paper.architecture }}</option>{% endfor %}</select></label>
  <button id="review-reset" type="button">필터 초기화</button>
</div>
<p id="review-count" role="status" aria-live="polite"></p>
<table id="research-catalog">
  <thead><tr><th scope="col">논문</th><th scope="col">연도·학회</th><th scope="col">분야</th><th scope="col">Architecture</th><th scope="col">근거 확보 범위</th></tr></thead>
  <tbody>{% for paper in site.data.papers %}
  <tr data-year="{{ paper.year }}" data-field="{{ paper.field }}" data-architecture="{{ paper.architecture }}">
    <td><a href="{{ '/ko/notes/research/' | append: paper.id | append: '/' | relative_url }}">{{ paper.name }}</a></td>
    <td>{{ paper.year }} · {{ paper.venue }}</td><td>{{ paper.field }}</td><td>{{ paper.architecture }}</td><td>{{ paper.evidence }}</td>
  </tr>{% endfor %}</tbody>
</table>
