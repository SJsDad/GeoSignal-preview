  scope: 접근 제한으로 Main Paper 전체 이미지·caption 검증 미완료.
  rights: 원본 이미지 재배포 권한을 확인하지 못해 공식·저자 원문 링크로 제공합니다.
  supplementary: 본문의 Appendices B/D/E 참조만 확인. 공식 supplement 원문·전체 Figure 목록·hyperparameter 검증 미완료.
  figures:
  - number: 1
    page: 2
    caption: Lithography와 mask optimization
    status: 색인 caption·본문 일부 / 시각 확인 미완료
    url: https://openaccess.thecvf.com/content/CVPR2026/papers/Son_Optical_Diffraction-based_Convolution_for_Semiconductor_Lithography_CVPR_2026_paper.pdf#page=2
    visual: Mask→wafer와 target→mask의 방향을 비교하는 개념도입니다. 축·색상·subfigure 번호는 직접 이미지 미열람입니다.
    reading: Forward model과 inverse task를 먼저 구분합니다. target 자체가 좋은 mask라는 가정이 성립하지 않음을 설명합니다.
    opc: 이미지 fidelity와 mask 제조 제약은 서로 다른 평가 목적입니다.
  - number: 2
    page: 4
    caption: OptiCo architecture와 OP block
    status: 색인 caption·본문 일부 / 시각 확인 미완료
    url: https://openaccess.thecvf.com/content/CVPR2026/papers/Son_Optical_Diffraction-based_Convolution_for_Semiconductor_Lithography_CVPR_2026_paper.pdf#page=4
    visual: Backbone, OP complex convolution, channel embedding, phase modulation, residual fusion을 설명합니다. 실제 배치·채널 색상은 미확인입니다.
    reading: 식 (6)–(12)의 Q·learned W 결합과 복소 branch를 따라갑니다. 어디에 optical prior가 들어가는지 확인하는 그림입니다.
    opc: 단순 complex CNN과 phase-constrained CNN의 비교가 필요합니다. residual feature가 실제 field라는 보장은 없습니다.
  - number: 3
    page: 7
    caption: FNO 추가와 OptiCo backbone 비교
    status: 색인 caption·본문 일부 / 시각 확인 미완료
    url: https://openaccess.thecvf.com/content/CVPR2026/papers/Son_Optical_Diffraction-based_Convolution_for_Semiconductor_Lithography_CVPR_2026_paper.pdf#page=7
    visual: Backbone에 Fourier module과 OptiCo를 넣는 비교입니다. 정확한 x/y축·legend·숫자는 직접 확인하지 못했습니다.
    reading: 같은 backbone 내 ablation인지 먼저 확인하고, global frequency 연산의 이득과 explicit prior의 이득을 구분합니다.
    opc: 표현 구조의 변화와 parameter/runtime 증가를 같이 봐야 합니다. 그림만으로 공정 검증을 주장하지 않습니다.
  - number: 4
    page: 7
    caption: Wavefront scale에 따른 OP kernel
    status: 색인 caption·본문 일부 / 시각 확인 미완료
    url: https://openaccess.thecvf.com/content/CVPR2026/papers/Son_Optical_Diffraction-based_Convolution_for_Semiconductor_Lithography_CVPR_2026_paper.pdf#page=7
    visual: 색인 본문은 (a)–(c)의 concentric phase pattern을 설명합니다. 원본 colormap·phase 단위는 시각 확인 미완료입니다.
    reading: Quadratic phase의 ring 간격 변화는 propagation-scale prior를 보여줍니다. intensity mask ring과 kernel phase ring을 혼동하지 않습니다.
    opc: 학습 scale을 실제 scanner focus·physical distance로 읽으려면 단위와 calibration을 별도로 확인해야 합니다.
  - number: 5
    page: 7
    caption: Intermediate feature 비교
    status: 색인 caption·본문 일부 / 시각 확인 미완료
    url: https://openaccess.thecvf.com/content/CVPR2026/papers/Son_Optical_Diffraction-based_Convolution_for_Semiconductor_Lithography_CVPR_2026_paper.pdf#page=7
    visual: OptiCo 유무의 corner·SRAF 주변 feature 반응을 비교합니다. feature channel과 색 범례는 미확인입니다.
    reading: corner 주변이 강조됐다는 설명을 읽되, 선택된 feature visualization은 constraint 보존의 증거가 아닙니다.
    opc: SRAF 비인쇄·worst EPE를 reference simulator에서 확인해야 합니다.
  - number: 6
    page: null
    caption: Diffraction-inspired optimized masks
    status: 색인 caption·본문 일부 / 시각 확인 미완료
    url: https://openaccess.thecvf.com/content/CVPR2026/papers/Son_Optical_Diffraction-based_Convolution_for_Semiconductor_Lithography_CVPR_2026_paper.pdf
    visual: ViaSet와 OOD StdContact 등의 mask 구조 비교를 설명합니다. 원본 subfigure 전체·color scale은 미확인입니다.
    reading: 외곽 ring 같은 구조가 OOD에서도 나타나는지 확인하는 정성 비교입니다. 완전한 optical mechanism 증명으로 취급하지 않습니다.
    opc: 유용한 assist pattern인지 판단하려면 dose/focus·MRC·shot 평가가 필요합니다.
lmlitho:
  inventory_complete: true
  scope: Main Paper 전체 Figure 목록 확인.
  rights: 원본 이미지 재배포 권한을 확인하지 못해 공식·저자 원문 링크로 제공합니다.
  supplementary: 별도 보충자료 공개·Figure 총수는 확인하지 못했습니다.
  figures:
  - number: 1
    page: 1
    caption: 세 가지 simulation paradigm 비교
    status: 본문·caption 확인 / 링크 및 해설
    url: https://www.cse.cuhk.edu.hk/~byu/papers/C286-ICCAD2025-LMLitho.pdf#page=1
    visual: (a) commercial optical+resist, (b) 작은 dataset의 ML, (c) source-aware LMLitho입니다. 체크표시는 저자 평가이며 정량 축이 없습니다.
    reading: 입력 source를 지원하는지와 학습 데이터 규모를 따라 읽습니다. qualitative strength 표와 benchmark 결과는 구분합니다.
    opc: 학습을 inference 앞에 이전하는 비용까지 고려해야 합니다.
  - number: 2
    page: 2
    caption: Transformer encoder 내부
    status: 본문·caption 확인 / 링크 및 해설
    url: https://www.cse.cuhk.edu.hk/~byu/papers/C286-ICCAD2025-LMLitho.pdf#page=2
    visual: Multi-head attention, residual Add & Norm, feed-forward, head concatenation을 보여주는 구조도입니다. Q/K/V는 feature matrix이며 광학 단위가 없습니다.
    reading: QK transpose의 attention score와 V weighted sum 순서를 확인합니다. normalization과 optical energy conservation은 다른 연산입니다.
    opc: Attention을 interference equation으로 동일시하지 않습니다.
  - number: 3
    page: 2
    caption: OPC EPE와 forward EPE의 reference
    status: 본문·caption 확인 / 링크 및 해설
    url: https://www.cse.cuhk.edu.hk/~byu/papers/C286-ICCAD2025-LMLitho.pdf#page=2
    visual: (a) target와 printed resist, (b) predicted resist와 ground truth resist의 edge distance입니다. 축은 image 좌표이고 epe 화살표는 edge 차이입니다.
    reading: 평가하는 reference contour가 어느 것인지 먼저 정합니다. 두 EPE가 같은 단위를 가져도 서로 다른 error입니다.
    opc: Forward prediction accuracy가 최종 mask target fidelity와 같은 목표가 아닙니다.
  - number: 4
    page: 3
    caption: Source families와 layout 예시
    status: 본문·caption 확인 / 링크 및 해설
    url: https://www.cse.cuhk.edu.hk/~byu/papers/C286-ICCAD2025-LMLitho.pdf#page=3
    visual: (a) circular/annular/bull’s eye/di-pole/quasar/multi-pole, (b) 7 typical layouts와 CPU M1입니다. panel grid는 성능 축이 아닙니다.
    reading: 입사 angular source의 모양과 wafer layout geometry를 구분합니다. CPU clip이 synthetic test 구조보다 복잡한 context를 제공합니다.
    opc: Source family나 layout 단위로 holdout을 나눠 중복된 pattern의 train/test leakage를 줄이는 설계를 검토합니다.
  - number: 5
    page: 4
    caption: Mask·source encoder와 resist decoder
    status: 본문·caption 확인 / 링크 및 해설
    url: https://www.cse.cuhk.edu.hk/~byu/papers/C286-ICCAD2025-LMLitho.pdf#page=4
    visual: Mask branch가 Q, source branch가 K/V를 제공하고 exposure attention 뒤 decoder가 RI를 생성합니다. block 반복 N1/N2/N3는 layer depth입니다.
    reading: 두 encoder와 fusion의 경로를 따라갑니다. feature normalization과 down/up-sampling을 optical transfer와 구별합니다.
    opc: Source-aware representation은 장점이지만 physical source summation을 exact enforce하는 구조는 아닙니다.
  - number: 6
    page: 4
    caption: ViT/CNN receptive-field 비교
    status: 본문·caption 확인 / 링크 및 해설
    url: https://www.cse.cuhk.edu.hk/~byu/papers/C286-ICCAD2025-LMLitho.pdf#page=4
    visual: 같은 mask에서 ViT/global context와 CNN/local receptive field, 생성 RI와 ground truth를 비교합니다. 표시된 receptive field는 network context입니다.
    reading: 오연결 영역을 확대해 local context 밖의 geometry가 어떤 영향을 줄 수 있는지 봅니다. 예시와 Table III ablation을 함께 읽습니다.
    opc: 전역 context가 필요한 optical diameter와 effective receptive field의 정량 비교가 추가로 필요합니다.
  - number: 7
    page: 5
    caption: Pre-training과 fine-tuning
    status: 본문·caption 확인 / 링크 및 해설
    url: https://www.cse.cuhk.edu.hk/~byu/papers/C286-ICCAD2025-LMLitho.pdf#page=5
    visual: Mask/Source/Cross-attention/Resist weights의 학습 흐름입니다. fine-tuning에서 Source Encoder를 freeze합니다. ❄ 표시는 parameter 고정입니다.
    reading: Freeze된 parameter와 통과하는 input gradient를 구분합니다. 업데이트되는 module이 무엇인지 확인합니다.
    opc: 새 optical condition까지 바뀌면 source freeze 정책의 적절성을 다시 검증해야 합니다.
  - number: 8
    page: 6
    caption: Source에 따른 resist 예측
    status: 본문·caption 확인 / 링크 및 해설
    url: https://www.cse.cuhk.edu.hk/~byu/papers/C286-ICCAD2025-LMLitho.pdf#page=6
    visual: 행 (a) via, (b) metal, (c) CPU M1. 열은 mask, annular, multi-pole, quasar. gray predicted RI와 red commercial contour를 중첩합니다.
    reading: 같은 행의 mask를 고정한 채 source별 printed shape 변화를 읽습니다. error는 contour gap이며 전체 gray area 크기만 비교하지 않습니다.
    opc: 같은 mask가 서로 다른 source에서 어떻게 달라지는지 보여줍니다. source별로 최적화된 mask를 비교한 실험은 아닙니다.
  - number: 9
    page: 8
    caption: 20 nm fine-tuning epoch별 RI
    status: 본문·caption 확인 / 링크 및 해설
    url: https://www.cse.cuhk.edu.hk/~byu/papers/C286-ICCAD2025-LMLitho.pdf#page=8
    visual: (a) epoch 1, (b) 9, (c) 17, (d) 25. 이 그림은 gray가 commercial RI, red가 model contour입니다. Fig. 8과 색 역할이 다릅니다.
    reading: 학습이 진행될수록 reference contour와의 gap이 줄어드는지 봅니다. epoch는 training 횟수이며 inference iteration이 아닙니다.
    opc: 20 nm transfer에는 fine-tuning data가 쓰였습니다. zero-shot generalization으로 해석하지 않습니다.
  - number: 10
    page: 8
    caption: 두 node의 forward mean EPE
    status: 본문·caption 확인 / 링크 및 해설
    url: https://www.cse.cuhk.edu.hk/~byu/papers/C286-ICCAD2025-LMLitho.pdf#page=8
    visual: 가로축 EPE/nm, 세로 범주는 28nm/20nm, legend는 LMLitho/DLS/DOINN입니다. 작은 값이 좋은 mean contour distance입니다.
    reading: 같은 node 안의 baseline을 비교하고 두 node를 하나의 순위로 합치지 않습니다. 28 nm의 0.42/0.84/0.67 nm는 원문 본문에도 명시됩니다.
    opc: Sub-pixel mean EPE는 interpolation/measurement convention을 확인해야 하며 worst-error guarantee가 아닙니다.
  - number: 11
    page: 8
    caption: Frozen simulator를 이용한 mask generator 학습
    status: 본문·caption 확인 / 링크 및 해설
    url: https://www.cse.cuhk.edu.hk/~byu/papers/C286-ICCAD2025-LMLitho.pdf#page=8
    visual: Target→mask generator→mask→frozen litho engine→resist→loss의 경로입니다. forward와 backward 화살표를 구분합니다.
    reading: Engine parameter가 고정돼도 input mask에 대한 derivative를 전달할 수 있음을 이해합니다.
    opc: Surrogate를 이용해 만든 mask는 독립 reference engine으로 다시 평가해야 합니다.
  - number: 12
    page: 8
    caption: OPC L2·PVB·EPE 비교
    status: 본문·caption 확인 / 링크 및 해설
    url: https://www.cse.cuhk.edu.hk/~byu/papers/C286-ICCAD2025-LMLitho.pdf#page=8
    visual: 가로 범주는 DLS/DOINN/commercial tool/LMLitho. 왼쪽 축 L2·PVB [nm²], 오른쪽 축 EPE [nm]이며 두 축의 scale이 다릅니다.
    reading: 서로 다른 단위의 bar/line 높이를 직접 비교하지 않습니다. final mask는 commercial tool로 계산한 지표이며 dose ±3%, focus ±40 nm 조건입니다.
    opc: Surrogate만으로 자기 평가하지 않은 점이 중요합니다. 그래프에서 불확실한 숫자를 임의 digitize하지 않습니다.
  - number: 13
    page: 8
    caption: Commercial·LMLitho mask/resist 세부
    status: 본문·caption 확인 / 링크 및 해설
    url: https://www.cse.cuhk.edu.hk/~byu/papers/C286-ICCAD2025-LMLitho.pdf#page=8
    visual: 4개 열은 C.T. mask, C.T. resist, LMLitho mask, LMLitho resist입니다. inset·표시 영역은 straight edge와 corner 차이를 강조합니다.
    reading: Mask morphology와 출력 contour를 따로 비교합니다. 보기 좋은 mask가 항상 target fidelity를 높이는 것은 아닙니다.
    opc: 부분 corner에서의 정성 우세를 full-chip 또는 wafer CD 우세로 확대하지 않습니다.
doinn:
  inventory_complete: true
  scope: Main Paper 전체 Figure 목록 확인.
  rights: arXiv perpetual non-exclusive 게시 license는 제3자 이미지 재배포 허가가 아닙니다. 원본은 링크로 제공합니다.
  supplementary: '동일 arXiv v1의 Appendix A.1–A.2: GP/LP/IR layer tables·configuration 확인. 별도 supplementary는 미확인.'
  figures:
  - number: 1
    page: 2
    caption: Optical+resist forward flow
    status: 본문·caption 확인 / 링크 및 해설
    url: https://arxiv.org/pdf/2203.08616v1#page=2
    visual: Mask image→aerial image→resist image 순서입니다. 이미지 좌표 외 성능 축은 없습니다.
    reading: Optical field/intensity 계산과 resist threshold/classification을 분리해 읽습니다.
    opc: Contour predictor가 optical field나 chemical resist를 직접 모델링하는지 확인해야 합니다.
  - number: 2
    page: 4
    caption: Approximate optical imaging 연산
    status: 본문·caption 확인 / 링크 및 해설
    url: https://arxiv.org/pdf/2203.08616v1#page=4
    visual: FFT, spectral kernel, IFFT, nonlinear intensity 항의 구조입니다. K와 alpha는 optics를 나타내며 layer feature channel과 다릅니다.
    reading: SOCS의 mask FFT와 optical kernel product가 어떻게 계산 비용을 줄이는지 봅니다.
    opc: 계산 형태가 닮았다고 learned weights가 실제 kernel이라는 보장은 없습니다.
  - number: 3
    page: 8
    caption: Stacked FNO와 reduced FNO
    status: 본문·caption 확인 / 링크 및 해설
    url: https://arxiv.org/pdf/2203.08616v1#page=8
    visual: (a) repeated Fourier units와 bypass, (b) single optimized unit입니다. 입력 lifting P와 projection Q의 위치를 비교합니다.
    reading: FFT 전에 channel을 늘리는 비용과 single-channel FFT 후 lifting 비용을 나눠 봅니다.
    opc: 고해상도 input에서 Fourier transforms의 반복 비용이 핵심 bottleneck일 수 있습니다.
  - number: 4
    page: 9
    caption: GP·LP·IR architecture
    status: 본문·caption 확인 / 링크 및 해설
    url: https://arxiv.org/pdf/2203.08616v1#page=9
    visual: Global branch는 pooling/FFT, local branch는 convolution, reconstruction은 concatenation/upsampling입니다. diagram의 /8은 공간 downsampling입니다.
    reading: Detail 정보가 GP에서 사라졌을 때 LP와 bypass가 보완하는 경로를 따라갑니다.
    opc: SRAF·corner detail은 global context만으로 충분하지 않으며 local edge error를 별도 평가해야 합니다.
  - number: 5
    page: 10
    caption: Large tile의 global feature 구성
    status: 본문·caption 확인 / 링크 및 해설
    url: https://arxiv.org/pdf/2203.08616v1#page=10
    visual: 작은 overlap clips와 큰 tile의 valid core를 보여줍니다. green core와 주변 halo를 구분합니다.
    reading: Half-overlap로 core를 덮고 boundaries를 제외하는 이유를 optical diameter와 연결합니다.
    opc: Halo 없는 independent tile inference는 주변 pattern 영향과 FFT wrap-around 오류를 만들 수 있습니다.
  - number: 6
    page: 12
    caption: 학습 epoch와 throughput
    status: 본문·caption 확인 / 링크 및 해설
    url: https://arxiv.org/pdf/2203.08616v1#page=12
    visual: 가로축 training epochs, 세로축 throughput [µm²/s], logarithmic scale입니다. UNet/DAMO/DOINN과 reference line을 비교합니다.
    reading: 높은 throughput·정확도 도달 epoch·reference simulator를 함께 읽습니다. reference 대비 ratio와 network 간 ratio는 다릅니다.
    opc: Hardware·training cost·clip area·I/O를 맞추지 않은 ratio는 전체 OPC TAT를 의미하지 않습니다.
  - number: 7
    page: 13
    caption: Global/local feature map
    status: 본문·caption 확인 / 링크 및 해설
    url: https://arxiv.org/pdf/2203.08616v1#page=13
    visual: (a) GP, (b) LP 여러 feature channels입니다. GP는 smooth intensity-like pattern, LP는 edge detail을 나타냅니다. 절대 physical unit은 지정하지 않습니다.
    reading: 각 branch가 다른 정보를 표현하는지 봅니다. feature brightness를 calibrated intensity와 동일시하지 않습니다.
    opc: feature visualization은 설계 해석의 단서이며 process-corner 보존을 증명하지 않습니다.
  - number: 8
    page: 14
    caption: OPC iteration mask perturbation 평가
    status: 본문·caption 확인 / 링크 및 해설
    url: https://arxiv.org/pdf/2203.08616v1#page=14
    visual: 가로축 OPC iteration 24개, 세로축 mIoU [%]; DOINN/UNet을 비교합니다. 초기 mask와 OPC된 학습 mask의 차이를 봅니다.
    reading: 같은 layout의 작은 변화에도 predictor가 안정적으로 response하는지 읽습니다.
