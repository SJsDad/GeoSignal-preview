  figures:
  - number: 1
    page: 2
    caption: Lithography and mask optimization
    status: Partial indexed caption/text / Visual verification incomplete
    url: https://openaccess.thecvf.com/content/CVPR2026/papers/Son_Optical_Diffraction-based_Convolution_for_Semiconductor_Lithography_CVPR_2026_paper.pdf#page=2
    visual: Conceptual mask→wafer and target→mask directions. Original axes, colors and subfigure labels were not
      visually inspected.
    reading: Distinguish forward and inverse tasks first; the target itself need not be a good mask.
    opc: Image fidelity and manufacturing constraints are different evaluation goals.
  - number: 2
    page: 4
    caption: OptiCo architecture and OP block
    status: Partial indexed caption/text / Visual verification incomplete
    url: https://openaccess.thecvf.com/content/CVPR2026/papers/Son_Optical_Diffraction-based_Convolution_for_Semiconductor_Lithography_CVPR_2026_paper.pdf#page=4
    visual: Backbone, OP complex convolution, channel embedding, phase modulation and residual fusion. Exact layout
      and channel colors remain unseen.
    reading: Follow Q/learned-W combinations and complex branches in equations (6)–(12) to locate the optical prior.
    opc: Compare ordinary complex and phase-constrained CNNs. Residual features are not necessarily physical fields.
  - number: 3
    page: 7
    caption: FNO additions versus the OptiCo backbone
    status: Partial indexed caption/text / Visual verification incomplete
    url: https://openaccess.thecvf.com/content/CVPR2026/papers/Son_Optical_Diffraction-based_Convolution_for_Semiconductor_Lithography_CVPR_2026_paper.pdf#page=7
    visual: Comparison of Fourier modules and OptiCo added to a backbone. Exact axes, legends and numbers were not
      directly verified.
    reading: Check for a matched-backbone ablation; separate global-frequency benefits from explicit-prior benefits.
    opc: Consider added parameters/runtime together with representation changes. The figure alone does not validate
      a process.
  - number: 4
    page: 7
    caption: OP kernels at different wavefront scales
    status: Partial indexed caption/text / Visual verification incomplete
    url: https://openaccess.thecvf.com/content/CVPR2026/papers/Son_Optical_Diffraction-based_Convolution_for_Semiconductor_Lithography_CVPR_2026_paper.pdf#page=7
    visual: Indexed text describes concentric phase patterns in (a)–(c). Original colormap and phase units remain
      visually unverified.
    reading: Changing quadratic-phase ring spacing illustrates a propagation-scale prior. Mask-intensity rings differ
      from kernel-phase rings.
    opc: Units and calibration are needed before interpreting learned scales as scanner focus or physical distance.
  - number: 5
    page: 7
    caption: Intermediate feature comparisons
    status: Partial indexed caption/text / Visual verification incomplete
    url: https://openaccess.thecvf.com/content/CVPR2026/papers/Son_Optical_Diffraction-based_Convolution_for_Semiconductor_Lithography_CVPR_2026_paper.pdf#page=7
    visual: Features around corners/SRAFs with and without OptiCo. Channel identities and color keys remain unverified.
    reading: Read the reported corner emphasis, but selected feature visualization does not prove constraint preservation.
    opc: Check nonprinting SRAFs and worst EPE with a reference simulator.
  - number: 6
    page: null
    caption: Diffraction-inspired optimized masks
    status: Partial indexed caption/text / Visual verification incomplete
