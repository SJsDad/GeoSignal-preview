name: Pages CI

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/pages-ci.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/pages-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate source links and front matter
        run: |
          python scripts/test_public_scope.py
          python scripts/validate_pages.py

      - name: Check JavaScript and Python syntax
        run: |
          node --check docs/assets/js/technical-notes.js
          node --check docs/assets/simulator/optics-engine.mjs
          node --input-type=module --check < docs/assets/simulator/simulator.js
          node --input-type=module --check < docs/assets/simulator/simulator-worker.js
          python -m py_compile scripts/validate_pages.py scripts/test_technical_notes.py scripts/test_bilingual_simulator.py

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Validate generated routes and links
        run: python scripts/validate_pages.py --site _site
